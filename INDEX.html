<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Tree</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; background-color: #f4f7f6; color: #333; }

    /* Password Screen */
    #password-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); display: flex;
      justify-content: center; align-items: center; z-index: 1000;
    }
    .login-box {
      background: white; padding: 30px; border-radius: 10px;
      text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 320px;
    }
    .login-box input {
      width: 100%; padding: 10px; margin: 15px 0;
      border: 1px solid #ccc; border-radius: 5px; font-size: 16px;
    }
    .login-box button {
      width: 100%; padding: 10px; background: #1f4e78;
      color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;
    }
    .login-box button:hover { background: #2d5b84; }
    .error { color: #e74c3c; font-size: 14px; display: none; margin-top: 5px; }

    /* Main Container */
    #app { display: none; padding: 25px; max-width: 1100px; margin: 0 auto; }
    h1 { text-align: center; color: #1f4e78; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }

    /* Generation Levels Filter */
    .level-section { margin-bottom: 25px; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .level-title { font-weight: bold; color: #1f4e78; margin-bottom: 10px; border-bottom: 2px solid #eef2f5; padding-bottom: 5px; }

    .tree-container { display: flex; flex-wrap: wrap; gap: 10px; }

    .person-card {
      background: #f8fafc; padding: 10px 18px; border-radius: 6px;
      border: 1.5px solid #1f4e78; cursor: pointer; transition: all 0.2s ease;
      font-weight: 600; color: #1f4e78; font-size: 14px;
    }
    .person-card:hover { background: #1f4e78; color: white; transform: translateY(-2px); }

    /* Details Panel */
    .details-panel {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 700px; background: white; padding: 25px; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: none; border-top: 5px solid #1f4e78;
      z-index: 500;
    }
    .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 20px; font-weight: bold; color: #888; }
    .close-btn:hover { color: #000; }

    .details-panel h2 { margin-top: 0; color: #1f4e78; font-size: 22px; }
    .detail-row { margin: 8px 0; font-size: 15px; }
    .detail-label { font-weight: bold; color: #444; }
  </style>
</head>
<body>

  <!-- Password Screen -->
  <div id="password-overlay">
    <div class="login-box">
      <h2>Family Tree Access</h2>
      <p>Enter password to view</p>
      <input type="password" id="password-input" placeholder="Password">
      <button onclick="checkPassword()">Enter</button>
      <div id="error-msg" class="error">Incorrect password!</div>
    </div>
  </div>

  <!-- Main Website -->
  <div id="app">
    <h1>Family Tree</h1>
    <p class="subtitle">Click on any person's name to view details</p>

    <div id="tree-root"></div>

    <!-- Details Box -->
    <div id="details-panel" class="details-panel">
      <span class="close-btn" onclick="closeDetails()">&times;</span>
      <h2 id="detail-name"></h2>
      <div id="detail-dob1"></div>
      <div id="detail-dod1"></div>
      <div id="detail-partner"></div>
      <div id="detail-dob2"></div>
      <div id="detail-dod2"></div>
      <div id="detail-parent"></div>
      <div id="detail-children"></div>
    </div>
  </div>

  <script>
    // EDIT YOUR WEBSITE PASSWORD HERE (Replace "familysecret" with your own password)
    const SET_PASSWORD = "Puttur2026";

    function checkPassword() {
      const input = document.getElementById("password-input").value;
      if (input === SET_PASSWORD) {
        document.getElementById("password-overlay").style.display = "none";
        document.getElementById("app").style.display = "block";
        autoLoadCSV();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    document.getElementById("password-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") checkPassword();
    });

    let familyData = [];

    function autoLoadCSV() {
      Papa.parse("family.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          familyData = results.data;
          renderTree();
        }
      });
    }

    function formatDate(val) {
      if (!val) return "";
      let str = val.toString().trim();
      if (str.includes("00:00:00")) {
        str = str.replace(" 00:00:00", "");
      }
      return str;
    }

    function renderTree() {
      const rootContainer = document.getElementById("tree-root");
      rootContainer.innerHTML = "";

      const levels = {};
      familyData.forEach(person => {
        const name = person["NAME"] ? person["NAME"].trim() : "";
        if (!name) return;

        const lvl = person["LEVEL"] ? person["LEVEL"].toString().trim() : "Other";
        if (!levels[lvl]) levels[lvl] = [];
        levels[lvl].push(person);
      });

      Object.keys(levels).sort().forEach(lvl => {
        const section = document.createElement("div");
        section.className = "level-section";

        const title = document.createElement("div");
        title.className = "level-title";
        title.innerText = "Generation / Level " + lvl;
        section.appendChild(title);

        const container = document.createElement("div");
        container.className = "tree-container";

        levels[lvl].forEach(person => {
          const card = document.createElement("div");
          card.className = "person-card";
          card.innerText = person["NAME"].trim();
          card.onclick = () => showDetails(person);
          container.appendChild(card);
        });

        section.appendChild(container);
        rootContainer.appendChild(section);
      });
    }

    function showDetails(person) {
      const name = person["NAME"] ? person["NAME"].trim() : "";
      const dob1 = formatDate(person["DOB 1"]);
      const dod1 = formatDate(person["DOD 1"]);

      const partner = person["PARTNER NAME"] ? person["PARTNER NAME"].trim() : "";
      const dob2 = formatDate(person["DOB 2"]);
      const dod2 = formatDate(person["DOD 2"]);

      const parent = person["PARENT NAME"] ? person["PARENT NAME"].trim() : "";

      document.getElementById("detail-name").innerText = name;

      document.getElementById("detail-dob1").innerHTML = dob1 
        ? `<div class="detail-row"><span class="detail-label">Date of Birth:</span> ${dob1}</div>` : "";

      document.getElementById("detail-dod1").innerHTML = dod1 
        ? `<div class="detail-row"><span class="detail-label">Date of Death:</span> ${dod1}</div>` : "";

      document.getElementById("detail-partner").innerHTML = partner 
        ? `<div class="detail-row"><span class="detail-label">Wife / Husband:</span> ${partner}</div>` : "";

      document.getElementById("detail-dob2").innerHTML = (partner && dob2) 
        ? `<div class="detail-row"><span class="detail-label">Partner's Date of Birth:</span> ${dob2}</div>` : "";

      document.getElementById("detail-dod2").innerHTML = (partner && dod2) 
        ? `<div class="detail-row"><span class="detail-label">Partner's Date of Death:</span> ${dod2}</div>` : "";

      document.getElementById("detail-parent").innerHTML = parent 
        ? `<div class="detail-row"><span class="detail-label">Parent Name:</span> ${parent}</div>` : "";

      const children = familyData
        .filter(item => item["PARENT NAME"] && item["PARENT NAME"].trim().toUpperCase() === name.toUpperCase())
        .map(item => item["NAME"].trim());

      document.getElementById("detail-children").innerHTML = (children.length > 0) 
        ? `<div class="detail-row"><span class="detail-label">Children:</span> ${children.join(", ")}</div>` : "";

      document.getElementById("details-panel").style.display = "block";
    }

    function closeDetails() {
      document.getElementById("details-panel").style.display = "none";
    }
  </script>
</body>
</html>
